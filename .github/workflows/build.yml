name: Build

permissions:
  contents: write

on:
  push:
    tags-ignore: [latest]
  pull_request:
  workflow_dispatch:

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install dolxz build dependencies
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev liblzma-dev pkg-config curl ca-certificates

      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git python3 make ca-certificates zip

      - name: Install Tremor (Ogg Vorbis decoder)
        # the devkitppc image already ships it; only go to the package server if it is missing
        run: dkp-pacman -Q ppc-libvorbisidec ppc-libogg || dkp-pacman -Sy --noconfirm --needed ppc-libvorbisidec ppc-libogg

      - name: Build controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: ./scripts/build_controller_portlibs.sh

      - name: Build boot.dol
        run: make package

      - name: Package (SD card layout)
        run: zip -r LittleAlchemy2-hbc.zip apps

      - uses: actions/upload-artifact@v4
        with:
          name: LittleAlchemy2-hbc
          path: apps/
      - uses: actions/upload-artifact@v4
        with:
          name: release-LittleAlchemy2
          if-no-files-found: error
          path: |
            LittleAlchemy2-hbc.zip

  # Every push to the default branch refreshes the "latest" release; tags like v1.2.0 also get their own release.
  release:
    needs: wii
    if: github.event_name == 'push' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-LittleAlchemy2
          path: out
      - name: Move the latest tag
        if: startsWith(github.ref, 'refs/heads/')
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish latest release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Little Alchemy 2 (latest)
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            Latest build of Little Alchemy 2 from ${{ github.sha }}.

            Extract LittleAlchemy2-hbc.zip to the root of your SD card (or USB drive) and open Little Alchemy 2 from the Homebrew Channel. The zip includes the icon pack and the music and sound effects.
          files: |
            out/LittleAlchemy2-hbc.zip
      - name: Publish tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Little Alchemy 2 ${{ github.ref_name }}
          make_latest: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Extract LittleAlchemy2-hbc.zip to the root of your SD card (or USB drive) and open Little Alchemy 2 from the Homebrew Channel. The zip includes the icon pack and the music and sound effects.
          files: |
            out/LittleAlchemy2-hbc.zip

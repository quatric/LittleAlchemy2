name: Build

permissions:
  contents: write

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  wii:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git python3 make ca-certificates zip

      - name: Build controller libraries (libwiidrc, libwupc, libsicksaxis)
        run: ./scripts/build_controller_portlibs.sh

      - name: Build boot.dol
        run: make package

      - name: Package (SD card layout)
        run: zip -r alchemii-hbc.zip apps -x 'apps/alchemii/icons.bin'

      - uses: actions/upload-artifact@v4
        with:
          name: alchemii-hbc
          path: apps/

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: alchemii-hbc.zip
